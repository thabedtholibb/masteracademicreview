name: Publish to PyPI

# Manual on purpose: run it after a GitHub release, once PyPI "trusted
# publishing" is set up for this repository (pypi.org -> Your projects ->
# Publishing -> add GitHub publisher: owner thabedtholibb, repo
# masteracademicreview, workflow publish.yml, environment pypi).
# No API token is stored in the repository.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
